syntax = "proto3";

// 包名统一为 gs：路由表里写的是 "gs.WalkReq" 这类全名，
// 两端必须一致，否则 RouteTable::Validate() 会在启动时直接报错退出（这是设计上的保护）。
package gs;

// ---------------------------------------------------------------------------
// 通用
// ---------------------------------------------------------------------------
message RetTip
{
    int32  code = 1;   // 0 = 成功；非 0 见代码约定
    string text = 2;
}

// ---------------------------------------------------------------------------
// 移动（Module::PLAYER）
// ---------------------------------------------------------------------------
message WalkReq
{
    int32 sx = 1;
    int32 sy = 2;
    int32 dx = 3;
    int32 dy = 4;
}

message WalkAck
{
    int32 code = 1;
    int32 x    = 2;
    int32 y    = 3;
    int32 dir  = 4;
}

message PathReq
{
    int32 dx = 1;
    int32 dy = 2;
}

message PathAck
{
    int32 code   = 1;
    repeated int32 xs = 2;
    repeated int32 ys = 3;
}

// ---------------------------------------------------------------------------
// 状态推送（S2C，无请求体）
// ---------------------------------------------------------------------------
message SCPushState
{
    uint64 pid  = 1;
    int32  hp   = 2;
    int32  mp   = 3;
    int64  gold = 4;
    int32  x    = 5;
    int32  y    = 6;
    int32  dir  = 7;
}

// ---------------------------------------------------------------------------
// GM（Module::SYS）
// ---------------------------------------------------------------------------
message GMCmdReq
{
    string cmd = 1;
    string arg = 2;
}

message GMAck
{
    int32  code = 1;
    string text = 2;
}
