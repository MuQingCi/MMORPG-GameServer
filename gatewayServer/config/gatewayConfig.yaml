gateway:
    # 键名统一小驼峰：与 config/zoneConfig.yaml 的 zoneId 写法一致。
    # 旧的 zoneID / gatewayID / EventThreadNum 会被"未知键检查"拒绝（改回即报错，不会静默生效）。
    zoneId: 1               # 所属区服
    gatewayId: 1            # 本网关在集群内的编号（多网关部署时区分）

    listenAddr: 127.0.0.1   # 本机联调用 127.0.0.1；对外服务/容器部署改 0.0.0.0
    # ★ 端口必须与 config/zoneConfig.yaml 的 gateways 列表一致（0.12 已对齐为 10000），
    #   否则场景服的反向连接会连不上。场景服自身的 net.listenPort 是 12345（仅联调/工具用），
    #   两者不要配成同一个值，否则同机运行会端口冲突。
    listenPort: 10000

    eventThreadNum: 4       # IO 线程数（>=1）：acceptor 与连接分摊到这些线程的 EventLoop 上
