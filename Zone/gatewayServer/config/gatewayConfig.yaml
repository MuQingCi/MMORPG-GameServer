gateway:
    # 键名统一小驼峰：与 config/zoneConfig.yaml 的 zoneId 写法一致。
    zoneId: 1               # 所属区服（后端握手上报的 zoneId 必须与它一致，否则连接被拒）
    gatewayId: 1            # 本网关在集群内的编号（多网关部署时区分）

    # ------------------------------------------------------------------
    # 公网监听：只接客户端（ClientFrame 协议，魔数 0xC1EB）
    # ------------------------------------------------------------------
    publicConfig:
        listenAddr: 127.0.0.1   # 本机联调用 127.0.0.1；对外服务/容器部署改 0.0.0.0
        listenPort: 10000

    # ------------------------------------------------------------------
    # 内网监听：只接区服内其它服务器（GateFrame 协议，魔数 0xC1EA）
    #   场景服/全局服/聊天服启动后反向连接到这里，并上报自己的服务身份。
    #   端口必须与 config/zoneConfig.yaml 的 gateways 列表一致（当前 127.0.0.1:13145）。
    # ------------------------------------------------------------------
    privateConfig:
        listenAddr: 127.0.0.1
        listenPort: 13145
        # 允许注册的后端服务号白名单（ServerID：3=CHAT, 4=GLOBAL, 8=SCENE_1）。
        # **必须显式配置**：不在白名单里的连接即使握手成功也会被立刻断开。
        # 注意写成分行列表；`[8]` 这种行内写法本解析器不支持（会被当成标量并报错）。
        allowedServices:
            - 8

    eventThreadNum: 4       # IO 线程数（>=1）：acceptor 与连接分摊到这些线程的 EventLoop 上

    # ------------------------------------------------------------------
    # 公网接入策略
    # ------------------------------------------------------------------
    # 客户端最小鉴权票据（开发期预共享密钥）。0 = 关闭校验（**仅联调可用**，启动日志会告警）。
    # 正式方案是登录服签发 token（阶段 5/7），这里先把"未鉴权不得访问业务路由"这条不变量立住。
    clientToken: 998877
    defaultServiceId: 8     # 客户端未显式绑定后端服务时的默认目标（8=SCENE_1）
    maxClientSessions: 4096 # 公网连接数上限（超过则拒绝新连接）
    maxPendingRoutes: 10000 # 在途请求上限（有界：满了回错误，不让内存无界增长）
    routeTtlMs: 15000       # 回程路由 TTL(ms)：后端超时不响应时回收记录

    # 日志级别：debug / info / warn / error
    # 排障（例如"某条消息到底有没有转发"）时改成 debug，会打出每帧的 src/dst/module/method。
    logLevel: info
